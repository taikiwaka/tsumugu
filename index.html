<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="つむぐ：本人らしい生活の継続を検証する架空データ専用PoC"><title>つむぐ | 支援を、次の人へ。</title><style>
:root{--ink:#183c3b;--muted:#647675;--green:#197866;--line:#dce6e2;--bg:#f4f7f3;--orange:#bf713c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:10px 17px}button:hover{background:#eaf3ed}button.primary{background:var(--green);color:white;border:0}button:focus-visible,a:focus-visible{outline:3px solid #d8924a}button:disabled{opacity:.5;cursor:default}input,select,textarea{width:100%;border:1px solid #bbcfc6;border-radius:8px;padding:10px;background:white;color:var(--ink)}textarea{min-height:110px}label{display:block;margin:14px 0}small,.muted{color:var(--muted)}h1{font-size:32px;line-height:1.4;letter-spacing:-1px;margin:10px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:8px 0}p{margin:8px 0 16px}.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}aside{background:#123e3a;color:white;padding:30px 20px;position:sticky;top:0;height:100vh}.brand{font-size:30px;letter-spacing:5px;font-weight:700}.tagline{font-size:11px;color:#bfd5cc;letter-spacing:1px}nav{display:grid;gap:8px;margin:45px 0}nav button{text-align:left;background:transparent;color:#cbded6;border:0;padding:13px}nav button.active{background:#2c5750;color:white}aside small{color:#b6cfc6}.main{padding:24px 42px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.badge{font-size:12px;padding:4px 10px;background:#e4efe7;border-radius:30px;display:inline-block;color:#2a6d56}.notice{background:#fff5df;border:1px solid #eddcbb;padding:10px 15px;border-radius:9px;font-size:12px;margin:18px 0}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:28px 0}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.two{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px}.stat{font-size:34px;font-weight:650;line-height:1.4;margin:10px 0}.stat small{font-size:15px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.pill{background:#f5eee2;color:#98622e;padding:3px 9px;border-radius:5px;font-size:12px}.avatar{width:56px;height:56px;display:grid;place-items:center;background:#e8eee0;border-radius:18px;font-size:26px;flex-shrink:0}.person{display:flex;gap:15px;align-items:center}.quote{border-left:3px solid #dba276;background:#faf7f0;padding:16px}.steps{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.steps span{padding:6px 12px;background:#edf2ee;border-radius:6px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.bar{height:6px;background:#e9efeb;border-radius:10px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#3d8a70}.empty{padding:30px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}.danger{color:#a84437}.good{color:var(--green)}footer{font-size:11px;color:var(--muted);padding:25px 0}.toast{position:fixed;bottom:22px;right:22px;background:#183c3b;color:white;padding:14px 20px;border-radius:10px;max-width:90vw;z-index:9}a{color:var(--green)}@media(max-width:1000px){.main{padding:20px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}aside{height:auto;position:static;padding:15px 20px}.brand{font-size:24px}nav{display:flex;overflow:auto;margin:15px 0 0;gap:5px}nav button{white-space:nowrap;font-size:12px;padding:9px}aside>small{display:none}.grid{grid-template-columns:1fr}.hero{display:block}.top{align-items:flex-start}.top>small{display:none}h1{font-size:27px}.card{padding:19px}.main{padding:16px}}
</style></head><body><div class="app"><aside><div class="brand">つむぐ<span style="color:#dcab6b">.</span></div><div class="tagline">支援を、次の人へ。</div><nav id="nav"></nav><small>PERSON-CENTERED CARE<br>PoC workspace / v1.0<br><br>3施設・12週間の検証案<br>すべて架空のサンプル</small></aside><main class="main"><header class="top"><span>生活の継続を支える実験室 <span class="badge">DEMO</span></span><small>外部送信なし / このブラウザ内で保存</small><button id="export">JSON出力</button></header><div class="notice">公開デモ専用：実名・実際の支援情報・口座情報は入力しないでください。画面切替は権限管理ではありません。AIはルールベースの模擬処理です。</div><div id="view"></div><footer>つむぐ PoC · 本人の意思・選好を中心に、家族の知識と支援者の実践をつなぐ。<br>このデモに実績データはありません。入力内容はこの端末内のみで、家族や施設には送信されません。</footer></main></div><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='tsumugu-demo-v1';const tabs=['今日の支援','本人の理解書','家族への共有','お金と引き継ぎ','検証ダッシュボード','実験の設計'];let page=0;
const seed=()=>({version:1,profile:{approved:false,note:'家族の語り：土曜の朝、公園を歩くのが好きです。大きな音は苦手で、予定の変更は写真で先に伝えると落ち着くことがあります。',draft:null},logs:[],feedback:[],money:[],handoff:false,audit:[],facilities:[{id:'A',name:'ひなたホーム',status:'検討中',fee:30000},{id:'B',name:'こもれびホーム',status:'検討中',fee:30000},{id:'C',name:'みなとホーム',status:'検討中',fee:30000}]});
let s=seed();try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1&&Array.isArray(saved.logs)&&Array.isArray(saved.feedback)&&Array.isArray(saved.money)&&Array.isArray(saved.facilities)&&Array.isArray(saved.audit))s=saved;}catch(e){}
const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random();const stamp=()=>new Date().toISOString();
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3500)}function save(action){s.audit.push({time:stamp(),action});try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){toast('端末への保存に失敗しました。JSON出力で保管してください。')}render()}
function metric(){const paired=s.feedback.filter(f=>s.logs.some(l=>l.id===f.logId));return {completed:s.logs.filter(l=>l.result==='実施').length,paired:paired.length,delta:paired.length?paired.reduce((a,f)=>a+f.after-f.before,0)/paired.length:null,saved:s.logs.length?s.logs.reduce((a,l)=>a+l.base-l.minutes,0)/s.logs.length:null,paid:s.facilities.filter(f=>f.status==='入金確認').length};}
function title(k,t,p){return `<div class="hero"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="muted">${p}</p></div><span class="badge">架空ケース P-001</span></div>`}function person(){return '<div class="person"><div class="avatar">葉</div><div><h2 style="margin:0">はるさん <small>（仮名）</small></h2><small>成人 / 言葉以外の反応も大切な意思表出</small></div></div>'}
function render(){ $('nav').innerHTML=tabs.map((t,i)=>`<button data-page="${i}" class="${i===page?'active':''}" aria-current="${i===page?'page':'false'}">0${i+1}　${t}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=Number(b.dataset.page);render()}); const m=metric();let html='';
if(page===0){html=title('DAILY SUPPORT','大切な習慣を、今日の支援へ。','記録して終わらず、本人の反応と次の支援までつなげます。')+`<div class="grid"><div class="card"><small>支援を実施</small><div class="stat">${m.completed}<small> 件</small></div><span class="muted">この端末のデモ記録</span></div><div class="card"><small>支援と家族の回答のペア</small><div class="stat">${m.paired}<small> 件</small></div><span class="muted">同じ出来事への回答</span></div><div class="card"><small>理解書の確認状況</small><div class="stat" style="font-size:23px">${s.profile.approved?'確認済み':'人の確認待ち'}</div><small>未確認の提案は支援へ進めません</small></div></div><div class="two"><section class="card">${person()}<div class="steps"><span>① 理解書を確認</span><span>② 支援と反応を記録</span><span>③ 家族の回答</span></div><div class="quote"><b>今日の小さな選択</b><br>公園を歩く / 室内で過ごす、写真で提示する。<br><small>本人が拒否したら見送る。家族の希望だけで実施しない。</small></div><form id="logform"><label>施設<select name="facility">${s.facilities.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></label><label>担当者（架空ID）<select name="staff"><option>S-01</option><option>S-02</option><option>S-03</option></select></label><label>今回の支援・本人の反応<textarea name="note" required maxlength="1200" placeholder="例：写真を2枚提示。公園の写真に手を伸ばしたため散歩へ。途中で戻りたい様子があり帰宅。"></textarea></label><div class="two"><label>実施結果<select name="result"><option>実施</option><option>本人の拒否で見送り</option><option>環境要因で見送り</option></select></label><label>本人の反応<select name="response"><option>肯定的な反応を観察</option><option>拒否・不快を観察</option><option>判別できない</option></select></label></div><div class="two"><label>通常の記録・引き継ぎ時間（分）<input name="base" type="number" min="0" max="240" value="12" required></label><label>今回の記録・引き継ぎ時間（分）<input name="minutes" type="number" min="0" max="240" value="5" required></label></div><label><input type="checkbox" name="share" style="width:auto"> この記録を家族画面に表示する（デモ内）</label><button class="primary" ${s.profile.approved?'':'disabled'}>支援記録を保存</button>${s.profile.approved?'':'<p><small>先に「本人の理解書」で内容を確認してください。</small></p>'}</form></section><section><div class="card"><h2>最近の支援</h2>${s.logs.length?s.logs.slice().reverse().map(l=>`<div class="row"><div><span class="badge">${esc(l.result)}</span><p>${esc(l.note)}</p><small>${esc(l.response)} · ${esc(l.staff)}<br>${new Date(l.at).toLocaleString('ja-JP')}</small></div></div>`).join(''):'<div class="empty">まだ記録がありません。<br>まず理解書を確認してみましょう。</div>'}</div><div class="card"><h3>現場が助かったこと × 家族が安心したこと</h3><p class="muted">支援記録のIDを家族の回答に結びつけます。安心度が下がった回答も残し、良い事例だけを選びません。</p></div></section></div>`;}
if(page===1){html=title('PERSONAL PASSPORT','親の知識を、本人の未来につなぐ。','家族の語り・本人の意思・支援者の観察を、混同せずに残します。')+`<div class="two"><section class="card">${person()}<label>家族の語り（架空情報のみ）<textarea id="story" maxlength="2000">${esc(s.profile.note)}</textarea></label><button class="primary" id="draft">構造化のデモを試す</button><p><small>外部AI未接続。キーワードを抽出する模擬処理です。</small></p><div class="quote">本人の意思は、表情・選択・拒否・普段との差も含めて確認します。「分からない」を残せる設計です。</div></section><section class="card"><h2>理解書の下書き</h2>${s.profile.draft?`<span class="badge">${s.profile.approved?'人が確認済み':'未確認の下書き'}</span><p><small>根拠：左の家族の語り / 更新 ${esc(s.profile.draft.at.slice(0,10))}</small></p><label>好きなこと・習慣<input id="likes" value="${esc(s.profile.draft.likes)}"></label><label>苦手・配慮<input id="care" value="${esc(s.profile.draft.care)}"></label><label>本人の意思・反応（未確認ならそのまま残す）<input id="will" value="${esc(s.profile.draft.will)}"></label><label>次の支援者が試すこと<textarea id="next">${esc(s.profile.draft.next)}</textarea></label><label><input id="review" type="checkbox" style="width:auto"> 家族の希望と本人の意思を分けて確認した</label><button class="primary" id="approve">内容を確認して支援に使う</button>`:'<div class="empty">「構造化のデモを試す」で下書きを作成します。</div>'}</section></div><section class="card"><h2>引き継ぎの確認</h2><p>新しい担当者が、本人の選択の確かめ方と、拒否時に見送ることを説明できるか確認します。</p><label><input id="handoff" type="checkbox" style="width:auto" ${s.handoff?'checked':''}> 模擬引き継ぎで、担当者が配慮・意思確認・見送り条件を説明できた</label><small>これは演習チェックです。本実験では所要時間と理解テスト3問を記録します。</small></section>`;}
if(page===2){const shared=s.logs.filter(l=>l.share);html=title('FAMILY CONNECTION','「どう過ごしたか」が、見える安心。','実施した事実と本人の反応を共有。家族の安心だけで支援の良し悪しを決めません。')+`<div class="two"><section class="card"><h2>共有された出来事</h2>${shared.length?shared.slice().reverse().map(l=>`<div class="row"><div><span class="badge">${esc(l.result)}</span><p>${esc(l.note)}</p><small>本人の反応：${esc(l.response)}</small><p><small>出来事ID：${esc(l.id)}</small></p>${s.feedback.some(f=>f.logId===l.id)?'<span class="badge">家族回答済み</span>':'<span class="pill">家族回答待ち</span>'}</div></div>`).join(''):'<div class="empty">家族への共有を選んだ支援記録がここに表示されます。</div>'}</section><section class="card"><h2>この出来事について回答</h2><form id="feedbackform"><label>対象の支援<select name="logId" required><option value="">選んでください</option>${shared.filter(l=>!s.feedback.some(f=>f.logId===l.id)).map(l=>`<option value="${esc(l.id)}">${esc(l.note.slice(0,40))}</option>`).join('')}</select></label><div class="two"><label>共有前の安心度<select name="before">${[1,2,3,4,5].map(v=>`<option>${v}</option>`).join('')}</select></label><label>共有後の安心度<select name="after">${[1,2,3,4,5].map(v=>`<option>${v}</option>`).join('')}</select></label></div><small>1＝とても不安 / 5＝とても安心。デモでは前後を同時入力。本実験は共有前に別途測定します。</small><label>安心したこと・気になったこと<textarea name="comment" required maxlength="1000" placeholder="例：本人が帰りたがった時に、予定より早く帰宅してくれたこと。"></textarea></label><button class="primary">家族の回答を記録</button></form><hr style="border:0;border-top:1px solid var(--line);margin:24px 0">${s.feedback.map(f=>`<p>${esc(f.comment)}<br><small>安心度 ${f.before} → ${f.after} / 支援記録と紐付け済み</small></p>`).join('')}</section></div>`;}
if(page===3){const total=s.money.reduce((a,r)=>a+r.amount,0);html=title('MONEY & CONTINUITY','お金を、本人の楽しみにつなげる。','初期検証は使途と確認状況の記録まで。送金・預かり・残高照合は行いません。')+`<div class="two"><section class="card"><h2>楽しみの予算 <span class="badge">仮のルール</span></h2><div class="stat">${total.toLocaleString()}<small> / 10,000円</small></div><p>デモ期間の累計。外出・趣味の支出目安。本人の選好と必要性を確認して人が判断します。</p><div class="bar"><i style="width:${Math.min(100,total/100)}%"></i></div>${total>10000?'<p class="danger">目安超過：担当者が内容を確認してください。不正と断定しません。</p>':''}<form id="moneyform"><label>本人の楽しみにつながる使途<input name="purpose" required maxlength="150" placeholder="例：本人が選んだ公園への交通費"></label><label>金額（円）<input name="amount" type="number" min="1" max="1000000" required></label><button class="primary">確認待ちで追加</button></form></section><section class="card"><h2>使途と確認履歴</h2>${s.money.length?s.money.map(r=>`<div class="row"><div><b>${esc(r.purpose)}</b><br>${r.amount.toLocaleString()}円 <small>${r.checked?'確認済み':'確認待ち'}</small></div>${r.checked?'':`<button data-check="${r.id}">担当者が確認</button>`}</div>`).join(''):'<div class="empty">記録はまだありません</div>'}<p><small>この確認は決済承認や法的権限の証明ではありません。原本の証憑・管理台帳は本実験の別管理です。</small></p></section></div><section class="card"><h2>親が不在になる前に、支援をつなぐ</h2><div class="grid"><div><h3>01　日常の支援</h3><p>担当：施設の支援責任者<br>代替：相談支援の担当者<br><small>本番で実在の担当・連絡経路を合意</small></p></div><div><h3>02　財産の管理</h3><p>担当・権限・代替を別途確認<br><small>家族であることだけで権限ありとは扱わない</small></p></div><div><h3>03　支援情報の更新</h3><p>毎月、本人の変化と情報の古さを確認<br><small>旧版を残し、確認者と根拠を記録</small></p></div></div></section>`;}
if(page===4){html=title('EVIDENCE, NOT IMPRESSIONS','続くか。助かるか。払うか。','デモ入力から集計。小標本の結果は、事業化の証明ではなく次の判断材料です。')+`<div class="grid"><div class="card"><small>記録業務の時間差 / 1件平均</small><div class="stat">${m.saved===null?'—':m.saved.toFixed(1)}<small> 分</small></div><small>通常時間 − 今回時間 / n=${s.logs.length}<br>自己申告・負値も保持</small></div><div class="card"><small>家族の安心度 / 平均変化</small><div class="stat">${m.delta===null?'—':(m.delta>=0?'+':'')+m.delta.toFixed(1)}<small> 点</small></div><small>同一出来事の前後差 / n=${m.paired}<br>未回答 ${s.logs.filter(l=>l.share).length-m.paired}件</small></div><div class="card"><small>入金確認した施設</small><div class="stat">${m.paid}<small> / 3施設</small></div><small>架空の状態入力 / 実際の請求なし</small></div></div><div class="two"><section class="card"><h2>事業者の支払意思を、行動で分ける</h2>${s.facilities.map(f=>`<div class="row"><div><b>${f.name}</b><br><small>仮説価格：月30,000円 / 施設</small></div><label style="margin:0"><span class="muted">契約状況</span><select data-status="${f.id}">${['検討中','見積提示','契約締結','入金確認','辞退'].map(v=>`<option ${v===f.status?'selected':''}>${v}</option>`).join('')}</select></label></div>`).join('')}<small>本実験は契約・入金証跡を別途確認。「払いたい」という回答を売上に数えません。</small></section><section class="card"><h2>投資ゲート <span class="pill">未判定</span></h2><div class="row"><span>第8週の継続利用率</span><b>未計測</b></div><div class="row"><span>本人の拒否が尊重された割合</span><b>未計測</b></div><div class="row"><span>有償更新の入金 / 3施設</span><b>未計測</b></div><p class="muted">この端末の操作だけでは、実際の継続利用・本人への効果・有償更新は検証できません。判定基準は「実験の設計」を参照。</p></section></div><section class="card"><h2>施設別：平均で悪化を隠さない</h2><div class="tablewrap"><table><thead><tr><th>施設</th><th>記録件数</th><th>家族回答</th><th>拒否・不快の観察</th></tr></thead><tbody>${s.facilities.map(f=>{const logs=s.logs.filter(l=>l.facility===f.id);return `<tr><td>${f.name}</td><td>${logs.length}</td><td>${s.feedback.filter(x=>logs.some(l=>l.id===x.logId)).length}</td><td>${logs.filter(l=>l.response==='拒否・不快を観察').length}</td></tr>`}).join('')}</tbody></table></div></section><section class="card"><h2>デモの操作履歴</h2><p><small>端末内の履歴です。改ざん防止監査ログではありません。</small></p>${s.audit.slice(-8).reverse().map(a=>`<div class="row"><span>${esc(a.action)}</span><small>${new Date(a.time).toLocaleString('ja-JP')}</small></div>`).join('')}<div class="actions"><button id="csv">支援・家族回答 CSV</button><button id="reset" class="danger">デモを初期化</button></div></section>`;}
if(page===5){html=title('PILOT BLUEPRINT','小さく始めて、厳しく判断する。','3施設・本人と家族12組・12週間。数値はすべて提案する判定基準です。')+`<div class="card"><h2>最初に売る価値</h2><p style="font-size:23px">担当者が替わっても、本人の大切な習慣が支援に反映される。</p><p class="muted">購入者：障害福祉の施設運営法人。利用者：支援者。受益者：本人と家族。既存の記録システムを置き換えず、引き継ぎと家族への説明に絞ります。</p></div><div class="grid"><div class="card"><span class="eyebrow">WEEK 1–2</span><h2>現状を測る</h2><p>記録・引き継ぎ時間、家族の安心度、本人の習慣の実施と拒否を測定。担当者と中止条件を合意。</p></div><div class="card"><span class="eyebrow">WEEK 3–10</span><h2>有償で使う</h2><p>月3万円 / 施設（仮説）。施設間で導入をずらし、通常業務と比較。週次で離脱理由と追加負担を確認。</p></div><div class="card"><span class="eyebrow">WEEK 11–12</span><h2>更新で判断する</h2><p>値引きなしの継続提案。意向・契約・入金を分ける。支援の悪化があれば拡大を止める。</p></div></div><section class="card"><h2>継続・改善・停止の判定案</h2><div class="tablewrap"><table><tr><th>検証軸</th><th>提案する基準</th><th>測り方</th></tr><tr><td>継続利用</td><td>第8週 70%以上</td><td>週2件以上の有効記録をした対象支援者 ÷ 事前登録対象者。休職除外は事前固定。</td></tr><tr><td>現場の負担</td><td>記録・共有時間 中央値20%以上減</td><td>同一担当・類似業務の導入前後。二重入力・研修・サポート時間も記録。</td></tr><tr><td>家族の安心</td><td>5段階で中央値+1以上、回答率80%以上</td><td>導入前・隔週・終了時。同一家族の対応データ。悪化した家族の割合も報告。</td></tr><tr><td>本人の生活</td><td>拒否の尊重100%、無理な実施0件</td><td>本人の意思確認・拒否・見送りを全件記録。未確認を肯定と扱わない。</td></tr><tr><td>支払い</td><td>3施設中2施設以上が有償更新・入金</td><td>更新契約と請求・入金の証跡。初回実験費と区別。</td></tr><tr><td>提供原価</td><td>定常支援2時間以内 / 施設・月</td><td>初期設定と定常業務を分離し、AI費・サポート工数を含める。</td></tr></table></div><p><small>すべて達成＋重大な問題なし → 次の10施設へ。安全上の問題 → 該当運用を停止して責任者が確認。その他未達 → 対象・価格・導線を修正して再検証。</small></p></section><section class="card"><h2>実データによる有償実験への移行条件</h2><p>本人への分かりやすい説明と意思確認、必要な権限・同意の確認、施設との契約、認証と役割別アクセス、共有先の限定、暗号化・バックアップ・削除手順、監査ログ、事故対応責任者を整備してから開始します。</p><p>公開デモはこれらを備えません。AIの実装時は根拠表示・人の承認・訂正履歴を必須にし、資金移動や支援の自動決定は行いません。</p><a href="docs/POC_PLAN.md">詳細な実験計画</a>　<a href="docs/CEO_REVIEW.md">CEO・投資家視点のレビュー</a>　<a href="docs/PRODUCTION_GATE.md">実験環境への移行仕様</a></section>`;}
$('view').innerHTML=html;bind();}
function bind(){if($('draft'))$('draft').onclick=()=>{const note=$('story').value.trim();if(!note)return toast('家族の語りを入力してください');s.profile.note=note;s.profile.approved=false;s.profile.draft={at:stamp(),likes:note.includes('公園')?'公園で過ごす（家族の語り。本人の現在の意思は未確認）':'要確認：家族の語りを確認してください',care:note.includes('音')?'音への配慮が必要か確認する':'要確認：具体的な配慮を聞き取る',will:'未確認：選択肢への本人の反応を支援時に記録する',next:note.includes('写真')?'写真で選択肢を示し、反応を確認する。拒否時は見送る。':'本人に合う伝え方を支援者が確認し、選択を支える。'};save('理解書の下書きを生成（模擬）')};if($('approve'))$('approve').onclick=()=>{if(!$('review').checked)return toast('確認項目にチェックしてください');['likes','care','will','next'].forEach(k=>s.profile.draft[k]=$(k).value);s.profile.approved=true;save('理解書を担当者が確認');toast('確認済みにしました。今日の支援を記録できます。')};if($('handoff'))$('handoff').onchange=e=>{s.handoff=e.target.checked;save('引き継ぎ演習の確認を更新')};if($('logform'))$('logform').onsubmit=e=>{e.preventDefault();if(!s.profile.approved)return;const f=new FormData(e.target);s.logs.push({id:uid(),at:stamp(),facility:f.get('facility'),staff:f.get('staff'),note:f.get('note'),result:f.get('result'),response:f.get('response'),base:Number(f.get('base')),minutes:Number(f.get('minutes')),share:f.has('share')});save('支援と本人の反応を記録');toast('支援記録を保存しました')};if($('feedbackform'))$('feedbackform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const id=f.get('logId');if(!s.logs.some(l=>l.id===id&&l.share)||s.feedback.some(x=>x.logId===id))return toast('未回答の支援を選んでください');s.feedback.push({id:uid(),at:stamp(),logId:id,before:Number(f.get('before')),after:Number(f.get('after')),comment:f.get('comment')});save('家族の安心・気になる点を記録');toast('支援記録と回答を紐付けました')};if($('moneyform'))$('moneyform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);s.money.push({id:uid(),at:stamp(),purpose:f.get('purpose'),amount:Number(f.get('amount')),checked:false});save('使途を確認待ちで記録')};document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const r=s.money.find(x=>x.id===b.dataset.check);r.checked=true;r.checkedAt=stamp();save('支出の記録を担当者が確認')});document.querySelectorAll('[data-status]').forEach(b=>b.onchange=()=>{s.facilities.find(x=>x.id===b.dataset.status).status=b.value;save('架空施設の契約状態を更新')});if($('reset'))$('reset').onclick=()=>{if(confirm('この端末のデモ記録をすべて削除しますか？')){s=seed();save('デモを初期化')}};if($('csv'))$('csv').onclick=()=>{const rows=[['record_id','facility','staff','created_at','support','result','response','baseline_minutes','actual_minutes','family_before','family_after','family_comment'],...s.logs.map(l=>{const f=s.feedback.find(x=>x.logId===l.id)||{};return [l.id,l.facility,l.staff,l.at,l.note,l.result,l.response,l.base,l.minutes,f.before??'',f.after??'',f.comment??'']})];download('tsumugu-demo.csv','\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};}
function download(name,body,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=()=>download('tsumugu-demo.json',JSON.stringify({notice:'架空データ専用デモ。実績・監査証跡ではない。',exportedAt:stamp(),...s},null,2),'application/json');render();
</script></body></html>
